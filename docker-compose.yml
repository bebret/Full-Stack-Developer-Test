services:
  db:
    image: postgres:16-alpine
    container_name: transaction-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: transactiondb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d transactiondb"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
